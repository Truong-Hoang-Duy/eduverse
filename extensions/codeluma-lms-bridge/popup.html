<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>CodeLuma → MindX LMS</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 13px;
        color: #1f2937;
        background: #ffffff;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
        color: #312e81;
      }
      .meta {
        font-size: 12px;
        color: #4b5563;
        background: #f5f3ff;
        border: 1px solid #ddd6fe;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      .list {
        max-height: 220px;
        overflow-y: auto;
        margin: 0 0 10px 0;
        padding: 0;
        list-style: none;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        border-bottom: 1px solid #f3f4f6;
        font-size: 12px;
      }
      .list li:last-child {
        border-bottom: none;
      }
      .status-filled {
        color: #15803d;
        font-weight: 600;
      }
      .status-ready {
        color: #4338ca;
        font-weight: 600;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        height: 32px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        background: #4f46e5;
        color: #ffffff;
        border: none;
      }
      .btn-outline {
        background: #ffffff;
        color: #374151;
        border: 1px solid #d1d5db;
      }
      .empty {
        text-align: center;
        padding: 16px 8px;
        color: #6b7280;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">🚀 CodeLuma → MindX LMS</div>
    </div>
    <div id="content"></div>
    <script src="popup.js"></script>
  </body>
</html>
